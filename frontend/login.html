<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <div class="tabs">
      <button type="button" class="tab active" data-mode="user">User</button>
      <button type="button" class="tab" data-mode="admin">Admin</button>
    </div>

    <h1 id="title">User login</h1>
    <p class="sub" id="subtitle">Sign in to open your home page.</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" type="text" required autocomplete="username">

      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password">

      <button type="submit" class="btn" id="submitBtn">Log in</button>
      <p class="message" id="message" role="alert"></p>
    </form>

    <p class="hint">Demo accounts: user / user123 and admin / admin123</p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

server.port=8080

# In-memory database: data is reset every time the app restarts
spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# JWT settings (secret must be at least 32 characters)
app.jwt.secret=ChangeThisSecretToSomethingLongAndRandom_12345
app.jwt.expiration-ms=3600000
